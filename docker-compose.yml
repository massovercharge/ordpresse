services:
  ordpresse:
    build: .
    container_name: ordpresse
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-18088}:8088"
    environment:
      - PORT=8088
      - HOST=0.0.0.0
      - ORDPRESSE_DATA_DIR=/app/data
      - ORDPRESSE_ADMIN_PASSWORD=${ORDPRESSE_ADMIN_PASSWORD:-ordpresse}
      - ORDPRESSE_SECRET_KEY=${ORDPRESSE_SECRET_KEY:-}
    volumes:
      - ./data:/app/data
