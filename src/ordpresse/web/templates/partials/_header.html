<!-- Top Brand & Action Bar -->
<div class="border-b border-slate-800/60 bg-slate-900/90 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5 flex items-center justify-between gap-4">
        <!-- Brand -->
        <div class="flex items-center gap-3 min-w-0">
            <div
                class="w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center shadow-md shadow-amber-500/20 text-slate-950 font-bold text-lg cursor-pointer select-none active:scale-95 transition-transform flex-shrink-0"
                data-tab-switch="tab-dictionary"
                title="Gå til Ordbog">
                📖
            </div>
            <div class="flex items-center gap-2.5 min-w-0">
                <span class="font-serif-title text-amber-400 font-bold text-base sm:text-lg tracking-tight cursor-pointer whitespace-nowrap hover:text-amber-300 transition-colors"
                    data-tab-switch="tab-dictionary">
                    Den Danske Ordpresse
                </span>
                <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-mono bg-slate-800/80 border border-slate-700/60 text-slate-300 whitespace-nowrap flex-shrink-0"
                    title="Server v{{ version }} — {{ 'Datasæt klar' if datasets_ready else 'Offline frø' }}">
                    <span class="w-1.5 h-1.5 rounded-full {{ 'bg-emerald-400 animate-pulse' if datasets_ready else 'bg-amber-400' }}"></span>
                    <span>v{{ version }}</span>
                </span>
            </div>
        </div>

        <!-- Global Quick Actions -->
        <div class="flex items-center gap-2.5 text-xs flex-shrink-0">
            <a href="/api/download/latest"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-lg text-xs font-semibold transition-all shadow-sm active:scale-95 whitespace-nowrap"
                title="Hent seneste komplette ordbog">
                <span>⬇</span>
                <span class="hidden sm:inline">Hent ordbog</span>
                <span class="sm:hidden">.zip</span>
            </a>
            <a href="/logout"
                class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 rounded-lg text-xs font-semibold transition-all shadow-sm active:scale-95 whitespace-nowrap"
                title="Log ud af Ordpresse">
                <span>🔒</span>
                <span class="hidden sm:inline">Log ud</span>
            </a>
        </div>
    </div>
</div>
