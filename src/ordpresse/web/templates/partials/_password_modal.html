<!-- Change Password Modal -->
<div id="change-pwd-modal"
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm hidden"
    style="background-color: rgba(2, 6, 23, 0.85);">
    <div
        class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4 relative z-50">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h3 class="text-base font-bold text-white flex items-center gap-2">
                <span>🔑</span> <span>Skift administrator-adgangskode</span>
            </h3>
            <button type="button" id="close-change-pwd-btn" onclick="togglePasswordModal(false)"
                class="text-slate-400 hover:text-slate-200 text-lg font-bold cursor-pointer">&times;</button>
        </div>

        <form id="change-pwd-form" class="space-y-3.5">
            <div>
                <label for="current-pwd-input" class="block text-xs font-medium text-slate-300 mb-1">Nuværende
                    adgangskode</label>
                <input type="password" id="current-pwd-input" required
                    class="w-full px-3.5 py-2 bg-slate-950 border border-slate-700/80 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500"
                    placeholder="••••••••">
            </div>
            <div>
                <label for="new-pwd-input" class="block text-xs font-medium text-slate-300 mb-1">Ny adgangskode
                    (min. 4 tegn)</label>
                <input type="password" id="new-pwd-input" required minlength="4"
                    class="w-full px-3.5 py-2 bg-slate-950 border border-slate-700/80 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500"
                    placeholder="••••••••">
            </div>
            <div>
                <label for="confirm-pwd-input" class="block text-xs font-medium text-slate-300 mb-1">Gentag ny
                    adgangskode</label>
                <input type="password" id="confirm-pwd-input" required minlength="4"
                    class="w-full px-3.5 py-2 bg-slate-950 border border-slate-700/80 rounded-xl text-xs text-slate-100 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500"
                    placeholder="••••••••">
            </div>

            <div id="change-pwd-feedback" class="hidden text-xs p-2.5 rounded-lg"></div>

            <div class="flex items-center justify-end gap-2 pt-2">
                <button type="button" id="cancel-change-pwd-btn" onclick="togglePasswordModal(false)"
                    class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold cursor-pointer">Annuller</button>
                <button type="submit" id="save-change-pwd-btn"
                    class="px-4 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold rounded-xl text-xs shadow-md shadow-amber-500/20 active:scale-95 cursor-pointer">Gem
                    ny kode</button>
            </div>
        </form>
    </div>
</div>
