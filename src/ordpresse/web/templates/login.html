<!DOCTYPE html>
<html lang="da" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log ind — Den Danske Ordpresse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d131f;
        }
        .font-serif-title {
            font-family: 'Cinzel', serif;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-amber-500 selection:text-slate-950">

    <div class="w-full max-w-md">
        <!-- Logo & Title -->
        <div class="text-center mb-8 space-y-2">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center shadow-lg shadow-amber-500/20 text-slate-950 text-2xl font-bold mb-3">
                📖
            </div>
            <h1 class="text-2xl font-bold tracking-tight font-serif-title text-amber-400">
                Den Danske Ordpresse
            </h1>
            <p class="text-xs text-slate-400">
                Lokal adgangskontrol (LAN Zone)
            </p>
        </div>

        <!-- Login Card -->
        <div class="bg-slate-900/90 rounded-2xl border border-slate-800 p-8 shadow-2xl backdrop-blur">
            <h2 class="text-lg font-semibold text-white mb-2">Log ind</h2>
            <p class="text-xs text-slate-400 mb-6">
                Indtast din administrators adgangskode for at få adgang til kontrolpanelet og ordbogsbyggeren.
            </p>

            {% if error %}
            <div class="mb-5 p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-300 text-xs flex items-center gap-2">
                <span>⚠️</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/login" method="POST" class="space-y-4">
                <div>
                    <label for="password" class="block text-xs font-medium text-slate-300 mb-1.5">
                        Adgangskode
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autofocus
                        placeholder="••••••••••••"
                        class="w-full px-4 py-2.5 bg-slate-950 border border-slate-700/80 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full py-2.5 px-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold text-sm rounded-xl shadow-lg shadow-amber-500/25 transition-all flex items-center justify-center gap-2 cursor-pointer active:scale-98"
                >
                    <span>Lås op</span>
                    <span>→</span>
                </button>
            </form>
        </div>

        <p class="text-center text-[11px] text-slate-500 mt-6">
            Beskyttet af Ordpresse Zero-Trust &copy; 2026
        </p>
    </div>

</body>
</html>
